<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erick Manrique - Personal Trainer IFBB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d0d;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Pantalla de Carga (Loader) */
        #loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #120514 0%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        /* Spinner con colores de la credencial IFBB */
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(147, 51, 234, 0.15);
            border-left-color: #a855f7;
            border-top-color: #6b21a8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 20px;
            color: #e9d5ff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Iframe a pantalla completa */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Clase para ocultar el cargador */
        .hidden {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Carga -->
    <div id="loader-container">
        <div class="spinner"></div>
        <div class="loader-text">Cargando aplicación...</div>
    </div>

    <!-- WebApp desplegada -->
    <iframe 
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbxxFJGM9xM14HJaEsBSqJqCw3PO6Cu6yvSrWKTXK61q44jj7TO7JxHY2ldkS7WC6nXQIA/exec"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

    <script>
        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('loader-container');

        // Ocultar cargador cuando el iframe responda la carga
        iframe.onload = function() {
            loader.classList.add('hidden');
        };

        // Respaldo de seguridad por si tarda la conexión
        setTimeout(function() {
            if (!loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
            }
        }, 8000);
    </script>
</body>
</html>
